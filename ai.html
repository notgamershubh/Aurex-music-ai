<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>AUREX AI</title>
<style>
:root{color-scheme:dark;--bg:#101010;--line:#303030;--text:#f4f4f4;--muted:#aaa;--gold:#d6b46a}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}.app{height:100dvh;display:grid;grid-template-columns:250px 1fr;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}.sidebar{background:#171717;border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:12px;min-width:0}.brand{font-size:20px;letter-spacing:.1em;font-weight:900;color:var(--gold);padding:6px}.sidebtn,.hist,.icon{border:1px solid transparent;background:transparent;color:var(--text);padding:10px;border-radius:10px;text-align:left}.sidebtn:hover,.hist:hover,.icon:hover{background:#292929}.new{border-color:#3b3b3b;background:#222;text-align:center}.label{color:var(--muted);font-size:12px;padding:4px 8px}.history{overflow:auto;display:flex;flex-direction:column}.hist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:12px}.main{display:flex;flex-direction:column;min-width:0;height:100dvh}.top{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #242424;flex-shrink:0}.gold{color:var(--gold);font-weight:800}.work{flex:1;overflow:auto;min-height:0;scroll-behavior:smooth}.chat{max-width:800px;min-height:100%;margin:auto;padding:28px 22px;display:flex;flex-direction:column}.welcome{margin:auto 0;padding:25px 0 45px}.welcome h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:0 0 10px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}.card{background:#191919;border:1px solid #333;color:var(--text);border-radius:12px;padding:13px;text-align:left}.card strong{display:block}.card span{font-size:12px;color:var(--muted)}.messages{display:flex;flex-direction:column;gap:22px}.msg{display:grid;grid-template-columns:29px 1fr;gap:12px;overflow-wrap:anywhere}.avatar{width:28px;height:28px;border-radius:50%;background:#292929;display:grid;place-items:center}.msg.ai .avatar{color:var(--gold);background:#2a251a}.content{white-space:pre-wrap;line-height:1.7;padding-top:2px;min-width:0}.content img{display:block;max-width:100%;max-height:600px;border-radius:12px;margin-top:8px}.content a{color:#e4c77e}.result{padding:10px 0;border-bottom:1px solid #333}.result p{color:var(--muted);font-size:13px;margin:4px 0}.actions{display:flex;gap:5px;margin-top:8px}.mini{background:transparent;color:var(--muted);border:0;padding:5px;font-size:12px}.composer{padding:10px 16px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 12%);flex-shrink:0}.box{max-width:800px;margin:auto;background:#1b1b1b;border:1px solid #3a3a3a;border-radius:20px;padding:9px 10px 8px}.box:focus-within{border-color:#666}textarea{width:100%;resize:none;max-height:160px;min-height:38px;border:0;outline:0;background:transparent;color:var(--text);padding:6px 8px}textarea::placeholder{color:#888}.tools{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}.tool{border:1px solid #393939;background:#252525;color:#ddd;border-radius:99px;padding:7px 10px;font-size:12px}.tool.active{background:#3a3020;border-color:#8a7040;color:#f2dba6}.send{border:0;border-radius:50%;width:36px;height:36px;background:var(--gold);font-size:19px;font-weight:900}.send:disabled{opacity:.5}.hint{text-align:center;color:#777;font-size:11px;padding-top:7px}.status{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}.overlay{display:none}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;inset:0 auto 0 0;width:min(82vw,285px);transform:translateX(-110%);transition:transform .18s}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0009;z-index:9}.chat{padding:18px 13px}.cards{grid-template-columns:1fr}.composer{padding:7px 8px max(9px,env(safe-area-inset-bottom))}.top{padding:0 10px}.top .pill{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">AUREX AI</div><button class="sidebtn new" id="new">＋ New chat</button><div class="label">RECENT CHATS</div><div class="history" id="history"></div><div class="bottom"><button class="sidebtn" id="clear">Clear chat history</button><p>Chat, search, image creation and voice—all in one conversation.</p></div></aside><div class="overlay" id="overlay"></div>
<section class="main"><header class="top"><div><button class="icon" id="menu">☰</button> <span class="gold">AUREX</span> <span class="muted">AI</span></div><a href="./index.html" style="color:#aaa;text-decoration:none;font-size:12px">Music Studio ↗</a></header>
<div class="work" id="work"><section class="chat"><div class="welcome" id="welcome"><h1>What can I help you with?</h1><p class="muted">Ask questions, write code, search the web, create images, or use voice—all in this chat.</p><div class="cards"><button class="card" data-prompt="Explain a difficult topic in simple Hindi."><strong>Learn something</strong><span>Step-by-step explanations</span></button><button class="card" data-prompt="Help me write and debug some code."><strong>Write code</strong><span>Build or fix a project</span></button><button class="card" data-prompt="Give me creative ideas for a Minecraft boss-fight video."><strong>Brainstorm ideas</strong><span>Creative directions</span></button><button class="card" data-prompt="Help me make a plan for my next project."><strong>Make a plan</strong><span>Turn goals into steps</span></button></div></div><div class="messages" id="messages"></div></section></div>
<div class="composer"><div class="box"><textarea id="prompt" rows="1" maxlength="5000" placeholder="Message AUREX AI…"></textarea><div class="tools"><div><button class="tool" id="search">⌕ Search</button> <button class="tool" id="image">▧ Create image</button> <button class="tool" id="voice">🎙 Voice</button> <button class="tool" id="read">◖ Read aloud</button></div><button class="send" id="send" aria-label="Send">↑</button></div></div><div class="hint">AI can make mistakes. Check important information.</div><div class="status" id="status"></div></div></section></div>
<script>
const API="https://aurex-music-ai.factoshubh1080p.workers.dev/api/ai", $=id=>document.getElementById(id);let messages=[],chats=[],active=null,mode="chat",busy=false;
try{chats=JSON.parse(localStorage.getItem("aurex_conversations")||"[]");if(!Array.isArray(chats))chats=[]}catch{chats=[]}
function persist(){try{localStorage.setItem("aurex_conversations",JSON.stringify(chats.slice(0,40)))}catch{}}
function save(){let c=chats.find(x=>x.id===active);if(!c)c={id:Date.now().toString(36),title:"New chat",messages:[]};c.messages=messages.slice(-80);let first=messages.find(x=>x.role==="user");if(first)c.title=first.content.slice(0,42);c.updated=Date.now();active=c.id;chats=[c,...chats.filter(x=>x.id!==c.id)];persist();history()}
function history(){const el=$("history");el.innerHTML="";chats.slice(0,25).forEach(c=>{let b=document.createElement("button");b.className="hist";b.textContent="• "+c.title;b.onclick=()=>load(c.id);el.appendChild(b)})}
function load(id){let c=chats.find(x=>x.id===id);if(!c)return;active=id;messages=c.messages||[];render();closeMenu()}
function render(){const root=$("messages");root.innerHTML="";$("welcome").style.display=messages.length?"none":"";messages.forEach(m=>{let row=document.createElement("div");row.className="msg "+(m.role==="assistant"?"ai":"");let av=document.createElement("div");av.className="avatar";av.textContent=m.role==="user"?"Y":"✦";let body=document.createElement("div"),content=document.createElement("div");content.className="content";content.textContent=m.content;if(m.image){let img=document.createElement("img");img.src=m.image;img.alt=m.content;content.appendChild(img);let a=document.createElement("a");a.href=m.image;a.download="aurex-image.jpg";a.textContent="Save image";content.appendChild(a)}if(m.results){m.results.forEach(x=>{let d=document.createElement("div");d.className="result";let a=document.createElement("a");a.href=x.url;a.target="_blank";a.rel="noopener";a.textContent=x.title;let p=document.createElement("p");p.textContent=x.description||"";d.append(a,p);content.appendChild(d)})}body.appendChild(content);if(m.role==="assistant"){let acts=document.createElement("div");acts.className="actions";let cp=document.createElement("button");cp.className="mini";cp.textContent="Copy";cp.onclick=async()=>{try{await navigator.clipboard.writeText(m.content);cp.textContent="Copied"}catch{}};let rd=document.createElement("button");rd.className="mini";rd.textContent="Read aloud";rd.onclick=()=>speak(m.content);acts.append(cp,rd);body.appendChild(acts)}row.append(av,body);root.appendChild(row)});requestAnimationFrame(()=>$("work").scrollTop=$("work").scrollHeight)}
function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=/[\u0900-\u097F]/.test(t)?"hi-IN":"en-US";speechSynthesis.speak(u)}
function setMode(m){mode=mode===m?"chat":m;$("search").classList.toggle("active",mode==="search");$("image").classList.toggle("active",mode==="image");$("prompt").placeholder=mode==="search"?"Search for a topic…":mode==="image"?"Describe the image to create…":"Message AUREX AI…";$("status").textContent=mode==="search"?"Search results appear in this chat.":mode==="image"?"Your generated image appears in this chat.":"";$("prompt").focus()}
function typing(){let row=document.createElement("div");row.className="msg ai";row.id="typing";row.innerHTML='<div class="avatar">✦</div><div class="content">Thinking…</div>';$("messages").appendChild(row)}
async function send(text){text=(text??$("prompt").value).trim();if(!text||busy)return;let task=mode;mode="chat";$("search").classList.remove("active");$("image").classList.remove("active");$("prompt").placeholder="Message AUREX AI…";$("prompt").value="";resize();busy=true;$("send").disabled=true;$("status").textContent="";messages.push({role:"user",content:text});render();save();typing();
try{let reply;if(task==="search"){let r=await fetch(API+"/search?q="+encodeURIComponent(text));let d=await r.json();if(!r.ok)throw Error(d.error||"Search failed");reply={role:"assistant",content:d.results?.length?"Search results for: "+text:"No results found.",results:d.results||[]}}
else if(task==="image"){let r=await fetch(API+"/image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text})});let d=await r.json();if(!r.ok)throw Error(d.error||"Image generation failed");reply={role:"assistant",content:"Generated image: "+text,image:d.dataURI}}
else{let payload=messages.slice(-12).map(m=>({role:m.role,content:m.content.slice(0,5000)}));let r=await fetch(API+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:payload})});let d=await r.json();if(!r.ok)throw Error(d.error||"Chat request failed");reply={role:"assistant",content:d.reply||"No response received."}}
$("typing")?.remove();messages.push(reply);save();render()
}catch(e){$("typing")?.remove();messages.push({role:"assistant",content:"Request failed: "+e.message+"\nTry again shortly; the free model may be temporarily unavailable or out of quota."});save();render()}finally{busy=false;$("send").disabled=false;$("prompt").focus()}}
function resize(){let p=$("prompt");p.style.height="auto";p.style.height=Math.min(p.scrollHeight,160)+"px"}
$("prompt").addEventListener("input",resize);$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("send").onclick=()=>send();$("search").onclick=()=>setMode("search");$("image").onclick=()=>setMode("image");$("new").onclick=()=>{messages=[];active=null;render();$("prompt").focus()};$("clear").onclick=()=>{if(confirm("Delete all saved chats?")){chats=[];messages=[];active=null;persist();history();render()}};$("read").onclick=()=>{let m=[...messages].reverse().find(x=>x.role==="assistant");if(m)speak(m.content)};
$("voice").onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("status").textContent="Voice input isn't supported in this browser. Try Chrome.";return}let r=new SR();r.lang="hi-IN";r.onresult=e=>{$("prompt").value+=($("prompt").value?" ":"")+e.results[0][0].transcript;resize()};r.onerror=e=>$("status").textContent="Voice error: "+e.error;r.start();$("status").textContent="Listening…"};
document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>send(b.dataset.prompt));$("menu").onclick=()=>{$("sidebar").classList.add("open");$("overlay").classList.add("show")};function closeMenu(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}$("overlay").onclick=closeMenu;$("closeSide")?.addEventListener("click",closeMenu);history();render();if(chats.length)load(chats[0].id);
</script></body></html>
